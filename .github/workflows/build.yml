name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore native libs cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg
            TMessagesProj/jni/libvpx
            TMessagesProj/jni/boringssl
          key: native-ndk21-${{ hashFiles('.gitmodules', 'TMessagesProj/jni/*.sh', 'TMessagesProj/jni/patches/**') }}

      - name: Install Android SDK parts
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;21.4.7075529" "build-tools;33.0.0" "build-tools;30.0.3" "platforms;android-33" "cmake;3.10.2.4988404"
          cp $ANDROID_HOME/build-tools/30.0.3/dx $ANDROID_HOME/build-tools/33.0.0/dx
          cp $ANDROID_HOME/build-tools/30.0.3/lib/dx.jar $ANDROID_HOME/build-tools/33.0.0/lib/dx.jar

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build yasm nasm

      - name: API keys
        run: |
          echo "APP_ID = ${{ secrets.APP_ID }}" > API_KEYS
          echo "APP_HASH = ${{ secrets.APP_HASH }}" >> API_KEYS

      - name: Native deps
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: TMessagesProj/jni
        run: |
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export NINJA_PATH=$(which ninja)
          ./build_libvpx_clang.sh
          ./build_ffmpeg_clang.sh
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh

      - name: Save native libs cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg
            TMessagesProj/jni/libvpx
            TMessagesProj/jni/boringssl
          key: native-ndk21-${{ hashFiles('.gitmodules', 'TMessagesProj/jni/*.sh', 'TMessagesProj/jni/patches/**') }}

      - name: Apply AK gram patch
        run: git apply --verbose akgram-effects.patch

      - name: Build APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -1)
          BT=$ANDROID_HOME/build-tools/33.0.0
          keytool -genkeypair -keystore akgram.jks -storepass akgram123 -keypass akgram123 -alias akgram -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AK gram"
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks akgram.jks --ks-pass pass:akgram123 --key-pass pass:akgram123 --out akgram.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: akgram-apk
          path: akgram.apk
